# ============================================================
# 一键部署：MySQL 8 + Redis 7 + 应用（NestJS 托管 API 与两套前端）
#   docker compose -f deploy/docker-compose.yml up -d --build
#   首次灌演示数据：docker compose -f deploy/docker-compose.yml run --rm seed
#   访问：http://localhost:4300/admin-vue/ 、http://localhost:4300/m/ 、http://localhost:4300/parent
# 必需环境变量：AUTH_SECRET（≥32 字符；生产未设置时应用拒绝启动）
# ============================================================
name: jiajiao

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: jiajiao
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表（37 张表）
      - ../apps/api-nest/db/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4300"
      AUTH_SECRET: ${AUTH_SECRET:?请在 deploy/.env 或环境变量中设置 AUTH_SECRET（>=32 字符）}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-}
      MYSQL_DATABASE: jiajiao
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 本地/便携 Redis 不设密码 → 留空；生产由 deploy/docker-compose.prod.yml 强制
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 生产必须关闭验证码回显（另注：镜像内 NODE_ENV=production，devCode 恒不回显）
      DEV_SMS: "0"
      # 短信通道（A1）：默认 mock（验证码只写服务端日志）；上线改为 tencent 并配齐下面 5 项
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      # 仅测试环境：mock 短信时把验证码打进日志（默认 0；生产不要开）
      SMS_MOCK_LOG_CODE: ${SMS_MOCK_LOG_CODE:-0}
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      # 支付通道（A2）：默认 mock（不产生真实收款）；上线改为 wechat 并配齐 7 项
      PAY_PROVIDER: ${PAY_PROVIDER:-mock}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_APIV3_KEY: ${WECHAT_PAY_APIV3_KEY:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_MAX_SKEW_SECONDS: ${WECHAT_PAY_MAX_SKEW_SECONDS:-300}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      JOBS_ENABLED: ${JOBS_ENABLED:-1}
      # 证件识别（P46）：默认 mock（按「姓名_身份证号」文件名解析，仅本地联调）；上线改 tencent 并配密钥
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_OCR_REGION: ${TENCENT_OCR_REGION:-ap-guangzhou}
      # 上传图片落盘目录（与下面 volumes 的挂载点一致，重建镜像不丢证件图）
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4300:4300"
    volumes:
      # 上传的证件/凭证图片：独立命名卷，重建镜像不丢（否则每次 up --build 后证件图全部 404）
      - app-uploads:/app/data/uploads
    restart: unless-stopped

  # 一次性演示数据（不影响常驻服务）：docker compose run --rm seed
  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["seed"]
    environment:
      # 镜像内 NODE_ENV=production，config.ts 会强制要求 AUTH_SECRET，
      # 否则 seed 容器直接抛「生产环境必须配置 AUTH_SECRET」而退出（真实踩过）
      AUTH_SECRET: ${AUTH_SECRET:?请在 deploy/.env 或环境变量中设置 AUTH_SECRET（>=32 字符）}
      NODE_ENV: production
      DEV_SMS: "0"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-}
      MYSQL_DATABASE: jiajiao
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "db/seed-min.mjs"]

volumes:
  mysql-data:
  app-uploads:
